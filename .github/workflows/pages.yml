name: Publish Snake & Ladder
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare public game files
        run: |
          mkdir -p _site/game
          cp game/index.html game/style.css game/game.mjs game/engine.mjs _site/game/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
