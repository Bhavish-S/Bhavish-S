  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<rect width="1200" height="330" rx="20" fill="url(#bg)"/>
<rect width="1200" height="330" rx="20" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="328" rx="19" stroke="#278c85" stroke-opacity="0.5" fill="none"/>

