    <text x="16" y="28" fill="#00d9ff" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700">04</text>
    <text x="16" y="54" fill="#f1fff9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800">IMAGE CVE SCAN</text>
    <text x="16" y="80" fill="#00f5a0" font-family="ui-monospace,Consolas,monospace" font-size="12">Trivy Vulnerability Scan</text>
    <text x="16" y="112" fill="#8baea6" font-family="Arial,Helvetica,sans-serif" font-size="12">Zero High/Crit CVEs</text>
  </g>

  <g transform="translate(960, 82)">
    <rect width="200" height="142" rx="12" fill="#081820" stroke="#1c5362" stroke-width="1.5"/>
    <rect width="200" height="4" rx="2" fill="url(#neon)"/>
    <text x="16" y="28" fill="#00d9ff" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700">05</text>
    <text x="16" y="54" fill="#f1fff9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800">DAST & STAGING</text>
    <text x="16" y="80" fill="#00f5a0" font-family="ui-monospace,Consolas,monospace" font-size="12">OWASP ZAP Dynamic</text>
    <text x="16" y="112" fill="#8baea6" font-family="Arial,Helvetica,sans-serif" font-size="12">Production Hardened</text>
  </g>

  <g transform="translate(245, 150)">
    <path d="M 0 0 L 20 0" stroke="#00f5a0" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 14 -5 L 22 0 L 14 5" fill="#00f5a0"/>
  </g>

  <g transform="translate(475, 150)">
    <path d="M 0 0 L 20 0" stroke="#00f5a0" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 14 -5 L 22 0 L 14 5" fill="#00f5a0"/>
  </g>

  <g transform="translate(705, 150)">
    <path d="M 0 0 L 20 0" stroke="#00f5a0" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 14 -5 L 22 0 L 14 5" fill="#00f5a0"/>
  </g>

  <g transform="translate(935, 150)">
    <path d="M 0 0 L 20 0" stroke="#00f5a0" stroke-width="2" stroke-dasharray="3 3"/>
    <path d="M 14 -5 L 22 0 L 14 5" fill="#00f5a0"/>
  </g>
</svg>