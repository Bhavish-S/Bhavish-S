    <rect width="200" height="4" rx="2" fill="url(#neon)"/>
    <text x="16" y="28" fill="#00d9ff" font-family="ui-monospace,Consolas,monospace" font-size="12" font-weight="700">03</text>
    <text x="16" y="54" fill="#f1fff9" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="800">BUILD & LINT</text>
    <text x="16" y="80" fill="#00f5a0" font-family="ui-monospace,Consolas,monospace" font-size="12">Docker Container</text>
    <text x="16" y="112" fill="#8baea6" font-family="Arial,Helvetica,sans-serif" font-size="12">Isolated Sandbox</text>
  </g>

  <g transform="translate(730, 82)">
