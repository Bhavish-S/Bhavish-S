<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title">
<title id="title">Active Operations — Mission Status Board</title>
<defs>
  <linearGradient id="bg" x2="1" y2="1">
    <stop offset="0%" stop-color="#030d14"/>
    <stop offset="50%" stop-color="#071b24"/>
    <stop offset="100%" stop-color="#050b16"/>
  </linearGradient>
  <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00f5a0"/>
    <stop offset="50%" stop-color="#75ff9e"/>
    <stop offset="100%" stop-color="#00d9ff"/>
  </linearGradient>
  <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00d9ff"/>
    <stop offset="100%" stop-color="#00f5a0"/>
  </linearGradient>
  <radialGradient id="halo">
    <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.22"/>
    <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1c5362" stroke-opacity="0.25"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>
<rect width="1200" height="390" rx="20" fill="url(#bg)"/>
<rect width="1200" height="390" rx="20" fill="url(#grid)"/>
<rect x="1" y="1" width="1198" height="388" rx="19" stroke="#278c85" stroke-opacity="0.5" fill="none"/>

