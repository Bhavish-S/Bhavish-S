<svg xmlns="http://www.w3.org/2000/svg" width="920" height="130" viewBox="0 0 920 130" role="img" aria-labelledby="title">
<title id="title">Certifications and Badges</title>
<defs>
  <!-- Background Gradients -->
  <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10232D"/>
    <stop offset="100%" stop-color="#0B1A22"/>
  </linearGradient>
  <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091B24"/>
    <stop offset="50%" stop-color="#07131B"/>
    <stop offset="100%" stop-color="#061017"/>
  </linearGradient>

  <!-- Accent Gradients -->
  <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00E5A8"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="cyan-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#00E5A8"/>
  </linearGradient>
  <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00E5A8" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>

  <!-- Patterns -->
  <pattern id="mesh-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#13303D" stroke-opacity="0.35"/>
  </pattern>
  <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1C3E4E" fill-opacity="0.4"/>
  </pattern>

  <!-- Glow Filters -->
  <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="920" height="130" rx="14" fill="#10232D"/>
<rect width="920" height="130" rx="14" fill="url(#mesh-grid)"/>
<rect x="1" y="1" width="918" height="128" rx="13" stroke="#13303D" stroke-width="1.2" fill="none"/>

  <text x="24" y="28" fill="#00E5A8" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">&#x1F396;&#xFE0F; CERTIFICATIONS &amp; BADGES</text>
  <a href="#certifications">
    <text x="896" y="28" fill="#38BDF8" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end">View All &#x2794;</text>
  </a>
  <path d="M 24 36 L 896 36" stroke="#13303D"/>
  
  <g transform="translate(24, 46)">
    <circle cx="84.0" cy="22" r="20" fill="#0D1E27" stroke="#00E5A8" stroke-width="1.5"/>
    <text x="84.0" y="28" font-size="16" text-anchor="middle">🛡️</text>
    <text x="84.0" y="56" fill="#FFFFFF" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Security</text>
    <text x="84.0" y="70" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9.5" text-anchor="middle">Security Fundamentals</text>
  </g>

  <g transform="translate(202, 46)">
    <circle cx="84.0" cy="22" r="20" fill="#0D1E27" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="84.0" y="28" font-size="16" text-anchor="middle">⚙️</text>
    <text x="84.0" y="56" fill="#FFFFFF" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Automation</text>
    <text x="84.0" y="70" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9.5" text-anchor="middle">Workflow &amp; Scripting</text>
  </g>

  <g transform="translate(380, 46)">
    <circle cx="84.0" cy="22" r="20" fill="#0D1E27" stroke="#A855F7" stroke-width="1.5"/>
    <text x="84.0" y="28" font-size="16" text-anchor="middle">♾️</text>
    <text x="84.0" y="56" fill="#FFFFFF" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DevOps</text>
    <text x="84.0" y="70" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9.5" text-anchor="middle">CI/CD &amp; Cloud</text>
  </g>

  <g transform="translate(558, 46)">
    <circle cx="84.0" cy="22" r="20" fill="#0D1E27" stroke="#00E5A8" stroke-width="1.5"/>
    <text x="84.0" y="28" font-size="16" text-anchor="middle">☁️</text>
    <text x="84.0" y="56" fill="#FFFFFF" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Cloud</text>
    <text x="84.0" y="70" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9.5" text-anchor="middle">Cloud Infrastructure</text>
  </g>

  <g transform="translate(736, 46)">
    <circle cx="84.0" cy="22" r="20" fill="#0D1E27" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="84.0" y="28" font-size="16" text-anchor="middle">🐙</text>
    <text x="84.0" y="56" fill="#FFFFFF" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Open Source</text>
    <text x="84.0" y="70" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="9.5" text-anchor="middle">Community Contributor</text>
  </g>


</svg>