<svg xmlns="http://www.w3.org/2000/svg" width="920" height="150" viewBox="0 0 920 150" role="img" aria-labelledby="title">
<title id="title">YVB&amp;Co Software Studio — Independent Technology Venture</title>
<defs>
  <linearGradient id="studio-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#141E28"/>
    <stop offset="100%" stop-color="#081219"/>
  </linearGradient>
  <linearGradient id="gold-amber" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#F59E0B"/>
    <stop offset="100%" stop-color="#FBBF24"/>
  </linearGradient>
  <pattern id="mesh-grid-studio" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E2F3D" stroke-opacity="0.3"/>
  </pattern>
</defs>

<rect width="920" height="150" rx="14" fill="url(#studio-bg)"/>
<rect width="920" height="150" rx="14" fill="url(#mesh-grid-studio)"/>
<rect x="1" y="1" width="918" height="148" rx="13" stroke="#2A3D4D" stroke-width="1.2" fill="none"/>

<!-- Left Accent Bar -->
<path d="M 4 20 L 4 130" stroke="#F59E0B" stroke-width="4" stroke-linecap="round"/>

<!-- Content Left -->
<g transform="translate(32, 28)">
  <text x="0" y="0" fill="#F59E0B" font-family="ui-monospace,monospace" font-size="11" font-weight="700" letter-spacing="2">VENTURE // PARTNER SOFTWARE STUDIO</text>
  <text x="0" y="32" fill="#FFFFFF" font-family="Space Grotesk,Inter,sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5">YVB&amp;CO <tspan fill="#F59E0B">—</tspan> ENGINEER YOUR VISION<tspan fill="#00E5A8">.</tspan></text>
  
  <text x="0" y="62" fill="#CBD5E1" font-family="Inter,sans-serif" font-size="13">Independent 6-person technology studio building bespoke enterprise ERPs, SaaS systems, and digital products.</text>
  <text x="0" y="82" fill="#94A3B8" font-family="Inter,sans-serif" font-size="12.5">Executive Role: <tspan fill="#00E5A8" font-weight="600">Chief Financial Officer (CFO) &amp; Chief Revenue Officer (CRO)</tspan> — Financial Architecture &amp; Client Growth.</text>
</g>

<!-- Right Stats / Button -->
<g transform="translate(680, 26)">
  <!-- Metrics Badges -->
  <rect x="0" y="0" width="100" height="42" rx="8" fill="#0C1720" stroke="#2A3D4D" stroke-width="1"/>
  <text x="50" y="20" fill="#00E5A8" font-family="Space Grotesk,sans-serif" font-size="18" font-weight="700" text-anchor="middle">06+</text>
  <text x="50" y="34" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">ENGINEERS</text>
  
  <rect x="112" y="0" width="100" height="42" rx="8" fill="#0C1720" stroke="#2A3D4D" stroke-width="1"/>
  <text x="162" y="20" fill="#38BDF8" font-family="Space Grotesk,sans-serif" font-size="18" font-weight="700" text-anchor="middle">100%</text>
  <text x="162" y="34" fill="#94A3B8" font-family="ui-monospace,monospace" font-size="9" text-anchor="middle">INDEPENDENT</text>
  
  <!-- Visit Button -->
  <g transform="translate(0, 56)">
    <rect x="0" y="0" width="212" height="38" rx="8" fill="#F59E0B"/>
    <text x="106" y="24" fill="#07131B" font-family="ui-monospace,monospace" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">VISIT YVB-CO.VERCEL.APP ↗</text>
  </g>
</g>
</svg>
