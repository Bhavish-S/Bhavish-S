  <text x="0" y="72" fill="#334155" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="500">enterprise software systems, institutional ERPs, and resilient cloud architectures.</text>
  <text x="0" y="96" fill="#0284C7" font-family="ui-monospace, Consolas, monospace" font-size="11.5" font-weight="700">STUDIO PORTFOLIO: https://vovalyx.in ↗</text>
</g>

