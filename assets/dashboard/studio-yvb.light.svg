<svg xmlns="http://www.w3.org/2000/svg" width="920" height="150" viewBox="0 0 920 150" role="img" aria-labelledby="title">
<title id="title">Vovalyx — Custom Software Development Company</title>
<defs>
  <pattern id="mesh-grid-studio-light" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#F1F5F9" stroke-width="1"/>
  </pattern>
</defs>

<rect width="920" height="150" rx="14" fill="#FFFFFF"/>
<rect width="920" height="150" rx="14" fill="url(#mesh-grid-studio-light)"/>
<rect x="1" y="1" width="918" height="148" rx="13" stroke="#E2E8F0" stroke-width="1.2" fill="none"/>

<!-- Left Accent Bar -->
<path d="M 4 20 L 4 130" stroke="#D97706" stroke-width="4" stroke-linecap="round"/>

<!-- Content Left -->
<g transform="translate(32, 28)">
