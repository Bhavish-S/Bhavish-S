<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-label="Interactive Snake and Ladder Web Game by Bhavish S">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="glow-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="grid-light" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#CBD5E1" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="918" height="228" rx="16" fill="url(#bg-light)" stroke="#CBD5E1" stroke-width="1.5"/>
  <rect x="1" y="1" width="918" height="228" rx="16" fill="url(#grid-light)"/>
  <path d="M 32 2 L 240 2" stroke="url(#glow-light)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(32, 34)">
    <circle cx="4" cy="-4" r="4" fill="#059669"/>
    <text x="16" y="0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#059669" letter-spacing="2">THE DIGITAL LAB // 01 · PLAYABLE BROWSER GAME</text>
    <text x="856" y="0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#64748B" letter-spacing="1.5" text-anchor="end">BHAVISH-S.GITHUB.IO/GAME</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(32, 82)">
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="34" font-weight="900" fill="#0F172A" letter-spacing="-0.8">
      Snake <tspan fill="#059669">&amp;</tspan> Ladder<tspan fill="#059669">.</tspan>
    </text>
    <text y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="14.5" fill="#64748B">
      A handcrafted retro break between builds. Climb ladders, dodge snakes, and race to 100.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(32, 160)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="28" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="14" y="18" fill="#059669">🎲</text>
    <text x="36" y="18" fill="#0F172A">DICE ENGINE</text>

    <!-- Pill 2 -->
    <rect x="148" y="0" width="130" height="28" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="162" y="18" fill="#0284C7">🤖</text>
    <text x="184" y="18" fill="#0F172A">YOU VS CPU</text>

    <!-- Pill 3 -->
    <rect x="288" y="0" width="144" height="28" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="302" y="18" fill="#E11D48">👥</text>
    <text x="324" y="18" fill="#0F172A">2-PLAYER LOCAL</text>

    <!-- Pill 4 -->
    <rect x="442" y="0" width="154" height="28" rx="7" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="456" y="18" fill="#059669">⚡</text>
    <text x="478" y="18" fill="#0F172A">GITHUB PAGES</text>
  </g>

  <!-- Right Side Interactive Graphic / CTA -->
  <g transform="translate(680, 50)">
    <!-- Stylized Mini Board Preview -->
    <rect x="0" y="0" width="200" height="135" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
    
    <!-- Mini Grid Lines -->
    <line x1="0" y1="34" x2="200" y2="34" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <line x1="0" y1="68" x2="200" y2="68" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <line x1="0" y1="102" x2="200" y2="102" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <line x1="50" y1="0" x2="50" y2="135" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <line x1="100" y1="0" x2="100" y2="135" stroke="#CBD5E1" stroke-dasharray="3 3"/>
    <line x1="150" y1="0" x2="150" y2="135" stroke="#CBD5E1" stroke-dasharray="3 3"/>

    <!-- Ladder Graphic -->
    <g stroke="#10B981" stroke-width="2" stroke-linecap="round">
      <line x1="25" y1="118" x2="75" y2="52"/>
      <line x1="33" y1="124" x2="83" y2="58"/>
      <line x1="28" y1="110" x2="36" y2="116"/>
      <line x1="42" y1="92" x2="50" y2="98"/>
      <line x1="56" y1="74" x2="64" y2="80"/>
      <line x1="70" y1="56" x2="78" y2="62"/>
    </g>

    <!-- Snake Graphic -->
    <path d="M 175 22 Q 140 45 165 75 T 120 115" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="175" cy="22" r="3.5" fill="#F43F5E"/>

    <!-- Dice Graphic -->
    <rect x="130" y="55" width="46" height="46" rx="8" fill="#F1F5F9" stroke="#059669" stroke-width="1.5"/>
    <!-- 6 pips -->
    <circle cx="142" cy="67" r="2.5" fill="#059669"/>
    <circle cx="142" cy="78" r="2.5" fill="#059669"/>
    <circle cx="142" cy="89" r="2.5" fill="#059669"/>
    <circle cx="164" cy="67" r="2.5" fill="#059669"/>
    <circle cx="164" cy="78" r="2.5" fill="#059669"/>
    <circle cx="164" cy="89" r="2.5" fill="#059669"/>

    <!-- Play CTA Overlay Button -->
    <rect x="15" y="90" width="170" height="34" rx="8" fill="#059669"/>
    <text x="100" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="1" text-anchor="middle">
      PLAY GAME LIVE ↗
    </text>
  </g>
</svg>