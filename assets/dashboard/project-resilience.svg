<svg xmlns="http://www.w3.org/2000/svg" width="440" height="136" viewBox="0 0 440 136" role="img">
<defs>
  <!-- Background Gradients -->
  <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10232D"/>
    <stop offset="100%" stop-color="#0B1A22"/>
  </linearGradient>
  <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091B24"/>
    <stop offset="50%" stop-color="#07131B"/>
    <stop offset="100%" stop-color="#061017"/>
  </linearGradient>

  <!-- Accent Gradients -->
  <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00E5A8"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="cyan-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#00E5A8"/>
  </linearGradient>
  <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00E5A8" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>

  <!-- Patterns -->
  <pattern id="mesh-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#13303D" stroke-opacity="0.35"/>
  </pattern>
  <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1C3E4E" fill-opacity="0.4"/>
  </pattern>

  <!-- Glow Filters -->
  <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="440" height="136" rx="12" fill="#10232D" stroke="#13303D" stroke-width="1.2"/>
<circle cx="28" cy="28" r="14" fill="#0A1821" stroke="#1C3E4E"/>
<text x="28" y="33" font-size="14" text-anchor="middle">🌐</text>
<text x="50" y="32" fill="#FFFFFF" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="14" font-weight="700">Route Resilience</text>
<rect x="372" y="18" width="52" height="18" rx="4" fill="#00E5A8" fill-opacity="0.15" stroke="#00E5A8" stroke-opacity="0.6"/>
<text x="398" y="30" fill="#00E5A8" font-family="ui-monospace,Consolas,monospace" font-size="9" font-weight="700" text-anchor="middle">Public</text>
<text x="16" y="58" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="11">Fault-tolerant network routing &amp; resilience graph simulation</text>

    <rect x="16" y="78" width="42" height="18" rx="4" fill="#0A1821" stroke="#1C3E4E"/>
    <text x="37.0" y="90" fill="#94A3B8" font-family="ui-monospace,Consolas,monospace" font-size="9.5" text-anchor="middle">HTML5</text>

    <rect x="64" y="78" width="48" height="18" rx="4" fill="#0A1821" stroke="#1C3E4E"/>
    <text x="88.0" y="90" fill="#94A3B8" font-family="ui-monospace,Consolas,monospace" font-size="9.5" text-anchor="middle">Canvas</text>

    <rect x="118" y="78" width="72" height="18" rx="4" fill="#0A1821" stroke="#1C3E4E"/>
    <text x="154.0" y="90" fill="#94A3B8" font-family="ui-monospace,Consolas,monospace" font-size="9.5" text-anchor="middle">Algorithms</text>

<path d="M 16 106 L 424 106" stroke="#13303D"/>
<text x="16" y="122" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="10.5">⭐ 32 &#160; 🍴 8</text>
