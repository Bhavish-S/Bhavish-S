<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="920" height="150" viewBox="0 0 920 150" role="img" aria-labelledby="title">
<title id="title">GitHub Achievements &amp; Recognition</title>
<defs>
  <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10232D"/>
    <stop offset="100%" stop-color="#08141B"/>
  </linearGradient>
  <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00E5A8"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
  <pattern id="mesh-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#13303D" stroke-opacity="0.35"/>
  </pattern>
</defs>

<rect width="920" height="150" rx="14" fill="url(#card-bg)"/>
<rect width="920" height="150" rx="14" fill="url(#mesh-grid)"/>
<rect x="1" y="1" width="918" height="148" rx="13" stroke="#13303D" stroke-width="1.2" fill="none"/>

<text x="24" y="28" fill="#00E5A8" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">🏆 OFFICIAL GITHUB ACHIEVEMENTS &amp; RECOGNITION</text>
<text x="896" y="28" fill="#38BDF8" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="600" text-anchor="end">@Bhavish-S // VERIFIED MILESTONES</text>
<path d="M 24 38 L 896 38" stroke="#13303D"/>

<!-- 01: YOLO -->
<g transform="translate(40, 48)">
  <circle cx="50" cy="32" r="28" fill="#07131B" stroke="#00E5A8" stroke-width="2"/>
  <image href="https://raw.githubusercontent.com/Schweinepriester/github-profile-achievements/main/images/yolo-default.png" x="24" y="6" width="52" height="52"/>
  <text x="50" y="76" fill="#00E5A8" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">YOLO</text>
  <text x="50" y="90" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">Direct PR Merged</text>
</g>

<!-- 02: QUICKDRAW -->
<g transform="translate(220, 48)">
  <circle cx="50" cy="32" r="28" fill="#07131B" stroke="#F59E0B" stroke-width="2"/>
  <image href="https://raw.githubusercontent.com/Schweinepriester/github-profile-achievements/main/images/quickdraw-default.png" x="24" y="6" width="52" height="52"/>
  <text x="50" y="76" fill="#F59E0B" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Quickdraw</text>
  <text x="50" y="90" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">Closed &lt; 5m</text>
</g>

<!-- 03: PULL SHARK -->
<g transform="translate(400, 48)">
  <circle cx="50" cy="32" r="28" fill="#07131B" stroke="#38BDF8" stroke-width="2"/>
  <image href="https://raw.githubusercontent.com/Schweinepriester/github-profile-achievements/main/images/pull-shark-default.png" x="24" y="6" width="52" height="52"/>
  <text x="50" y="76" fill="#38BDF8" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Pull Shark x2</text>
  <text x="50" y="90" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">16 Merged PRs</text>
</g>

<!-- 04: PAIR EXTRAORDINAIRE -->
<g transform="translate(580, 48)">
  <circle cx="50" cy="32" r="28" fill="#07131B" stroke="#A855F7" stroke-width="2"/>
  <image href="https://raw.githubusercontent.com/Schweinepriester/github-profile-achievements/main/images/pair-extraordinaire-default.png" x="24" y="6" width="52" height="52"/>
  <text x="50" y="76" fill="#A855F7" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Pair Extra x2</text>
  <text x="50" y="90" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">16 Co-authored PRs</text>
</g>

<!-- 05: GALAXY BRAIN -->
<g transform="translate(760, 48)">
  <circle cx="50" cy="32" r="28" fill="#07131B" stroke="#34D399" stroke-width="2"/>
  <image href="https://raw.githubusercontent.com/Schweinepriester/github-profile-achievements/main/images/galaxy-brain-default.png" x="24" y="6" width="52" height="52"/>
  <text x="50" y="76" fill="#34D399" font-family="Space Grotesk, Inter, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Galaxy Brain x2</text>
  <text x="50" y="90" fill="#94A3B8" font-family="Inter, Arial, sans-serif" font-size="10" text-anchor="middle">8 Accepted Answers</text>
</g>
</svg>
