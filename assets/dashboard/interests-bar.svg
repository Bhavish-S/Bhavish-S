<svg xmlns="http://www.w3.org/2000/svg" width="920" height="80" viewBox="0 0 920 80" role="img">
<defs>
  <!-- Background Gradients -->
  <linearGradient id="card-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#10232D"/>
    <stop offset="100%" stop-color="#0B1A22"/>
  </linearGradient>
  <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091B24"/>
    <stop offset="50%" stop-color="#07131B"/>
    <stop offset="100%" stop-color="#061017"/>
  </linearGradient>

  <!-- Accent Gradients -->
  <linearGradient id="emerald-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#00E5A8"/>
    <stop offset="100%" stop-color="#38BDF8"/>
  </linearGradient>
  <linearGradient id="cyan-emerald" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="100%" stop-color="#00E5A8"/>
  </linearGradient>
  <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#00E5A8" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
  </linearGradient>

  <!-- Patterns -->
  <pattern id="mesh-grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#13303D" stroke-opacity="0.35"/>
  </pattern>
  <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#1C3E4E" fill-opacity="0.4"/>
  </pattern>

  <!-- Glow Filters -->
  <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
</defs>
<rect width="920" height="80" rx="12" fill="#07131B"/>

  <g transform="translate(20, 24)">
    <rect width="138" height="32" rx="8" fill="#10232D" stroke="#13303D" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12">🛡️</text>
    <text x="32" y="20" fill="#F1F5F9" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600">Threat Detection</text>
  </g>

  <g transform="translate(168, 24)">
    <rect width="138" height="32" rx="8" fill="#10232D" stroke="#13303D" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12">⚙️</text>
    <text x="32" y="20" fill="#F1F5F9" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600">Security Automation</text>
  </g>

  <g transform="translate(316, 24)">
    <rect width="138" height="32" rx="8" fill="#10232D" stroke="#13303D" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12">♾️</text>
    <text x="32" y="20" fill="#F1F5F9" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600">DevSecOps</text>
  </g>

  <g transform="translate(464, 24)">
    <rect width="138" height="32" rx="8" fill="#10232D" stroke="#13303D" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12">☁️</text>
    <text x="32" y="20" fill="#F1F5F9" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600">Infrastructure as Code</text>
  </g>

  <g transform="translate(612, 24)">
    <rect width="138" height="32" rx="8" fill="#10232D" stroke="#13303D" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12">🐙</text>
    <text x="32" y="20" fill="#F1F5F9" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600">Open Source</text>
  </g>

  <g transform="translate(760, 24)">
    <rect width="138" height="32" rx="8" fill="#10232D" stroke="#13303D" stroke-width="1.2"/>
    <text x="12" y="20" font-size="12">🤖</text>
    <text x="32" y="20" fill="#F1F5F9" font-family="Inter, Arial, sans-serif" font-size="10.5" font-weight="600">AI for Security</text>
  </g>

</svg>