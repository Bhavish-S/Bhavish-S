    <stop offset="100%" stop-color="#0B1A22"/>
  </linearGradient>
  <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#091B24"/>
    <stop offset="50%" stop-color="#07131B"/>
    <stop offset="100%" stop-color="#061017"/>
  </linearGradient>

  <!-- Accent Gradients -->
