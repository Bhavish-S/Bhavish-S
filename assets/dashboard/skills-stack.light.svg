</defs>

<rect width="920" height="280" rx="14" fill="#FFFFFF"/>
<rect width="920" height="280" rx="14" fill="url(#mesh-grid-stack-light)"/>
<rect x="1" y="1" width="918" height="278" rx="13" stroke="#E2E8F0" stroke-width="1.2" fill="none"/>

