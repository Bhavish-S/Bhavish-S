<svg xmlns="http://www.w3.org/2000/svg" width="920" height="230" viewBox="0 0 920 230" role="img" aria-label="Interactive Snake and Ladder Web Game by Bhavish S">
  <defs>
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07131B"/>
      <stop offset="100%" stop-color="#0E222D"/>
    </linearGradient>
    <linearGradient id="glow-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5A8"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00E5A8"/>
    </linearGradient>
    <pattern id="grid-dark" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E3A47" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Base Card -->
  <rect x="1" y="1" width="918" height="228" rx="16" fill="url(#bg-dark)" stroke="#1E3A47" stroke-width="1.5"/>
  <rect x="1" y="1" width="918" height="228" rx="16" fill="url(#grid-dark)"/>
  <path d="M 32 2 L 240 2" stroke="url(#glow-dark)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <g transform="translate(32, 34)">
    <circle cx="4" cy="-4" r="4" fill="#00E5A8"/>
    <text x="16" y="0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="700" fill="#00E5A8" letter-spacing="2">THE DIGITAL LAB // 01 · PLAYABLE BROWSER GAME</text>
    <text x="856" y="0" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="1.5" text-anchor="end">BHAVISH-S.GITHUB.IO/GAME</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(32, 82)">
    <text font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" letter-spacing="-0.8">
      Snake <tspan fill="#00E5A8">&amp;</tspan> Ladder<tspan fill="#00E5A8">.</tspan>
    </text>
    <text y="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif" font-size="14.5" fill="#94A3B8">
      A handcrafted retro break between builds. Climb ladders, dodge snakes, and race to 100.
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(32, 160)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10.5" font-weight="700">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="138" height="28" rx="7" fill="#13303D" stroke="#1E4759"/>
    <text x="14" y="18" fill="#00E5A8">🎲</text>
    <text x="36" y="18" fill="#FFFFFF">DICE ENGINE</text>

    <!-- Pill 2 -->
    <rect x="148" y="0" width="130" height="28" rx="7" fill="#13303D" stroke="#1E4759"/>
    <text x="162" y="18" fill="#38BDF8">🤖</text>
    <text x="184" y="18" fill="#FFFFFF">YOU VS CPU</text>

    <!-- Pill 3 -->
    <rect x="288" y="0" width="144" height="28" rx="7" fill="#13303D" stroke="#1E4759"/>
    <text x="302" y="18" fill="#F43F5E">👥</text>
    <text x="324" y="18" fill="#FFFFFF">2-PLAYER LOCAL</text>

    <!-- Pill 4 -->
    <rect x="442" y="0" width="154" height="28" rx="7" fill="#13303D" stroke="#1E4759"/>
    <text x="456" y="18" fill="#00E5A8">⚡</text>
    <text x="478" y="18" fill="#FFFFFF">GITHUB PAGES</text>
  </g>

  <!-- Right Side Interactive Graphic / CTA -->
  <g transform="translate(680, 50)">
    <!-- Stylized Mini Board Preview -->
    <rect x="0" y="0" width="200" height="135" rx="12" fill="#0E222D" stroke="#1E3A47" stroke-width="1.2"/>
    
    <!-- Mini Grid Lines -->
    <line x1="0" y1="34" x2="200" y2="34" stroke="#1E3A47" stroke-dasharray="3 3"/>
    <line x1="0" y1="68" x2="200" y2="68" stroke="#1E3A47" stroke-dasharray="3 3"/>
    <line x1="0" y1="102" x2="200" y2="102" stroke="#1E3A47" stroke-dasharray="3 3"/>
    <line x1="50" y1="0" x2="50" y2="135" stroke="#1E3A47" stroke-dasharray="3 3"/>
    <line x1="100" y1="0" x2="100" y2="135" stroke="#1E3A47" stroke-dasharray="3 3"/>
    <line x1="150" y1="0" x2="150" y2="135" stroke="#1E3A47" stroke-dasharray="3 3"/>

    <!-- Ladder Graphic -->
    <g stroke="#00E5A8" stroke-width="2" stroke-linecap="round">
      <line x1="25" y1="118" x2="75" y2="52"/>
      <line x1="33" y1="124" x2="83" y2="58"/>
      <line x1="28" y1="110" x2="36" y2="116"/>
      <line x1="42" y1="92" x2="50" y2="98"/>
      <line x1="56" y1="74" x2="64" y2="80"/>
      <line x1="70" y1="56" x2="78" y2="62"/>
    </g>

    <!-- Snake Graphic -->
    <path d="M 175 22 Q 140 45 165 75 T 120 115" fill="none" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="175" cy="22" r="3.5" fill="#FB7185"/>

    <!-- Dice Graphic -->
    <rect x="130" y="55" width="46" height="46" rx="8" fill="#13303D" stroke="#00E5A8" stroke-width="1.5"/>
    <!-- 6 pips -->
    <circle cx="142" cy="67" r="2.5" fill="#00E5A8"/>
    <circle cx="142" cy="78" r="2.5" fill="#00E5A8"/>
    <circle cx="142" cy="89" r="2.5" fill="#00E5A8"/>
    <circle cx="164" cy="67" r="2.5" fill="#00E5A8"/>
    <circle cx="164" cy="78" r="2.5" fill="#00E5A8"/>
    <circle cx="164" cy="89" r="2.5" fill="#00E5A8"/>

    <!-- Play CTA Overlay Button -->
    <rect x="15" y="90" width="170" height="34" rx="8" fill="#00E5A8"/>
    <text x="100" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" font-weight="800" fill="#07131B" letter-spacing="1" text-anchor="middle">
      PLAY GAME LIVE ↗
    </text>
  </g>
</svg>