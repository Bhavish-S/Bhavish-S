<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="140" viewBox="0 0 1120 140" role="img" aria-labelledby="title"><title id="title">Security is not a product, but a process. — Bruce Schneier</title><rect x=".5" y=".5" width="1119" height="139" rx="12" fill="#0d1418" stroke="#294039"/><text x="36" y="38" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="#89e9b5" letter-spacing="2">HACK THE PLANET — LEGALLY</text><text x="36" y="79" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#f0f6f2" >Security is not a product, but a process.</text><text x="36" y="111" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="400" fill="#9bb0ab" >— Bruce Schneier</text><text x="1080" y="112" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="400" fill="#9bb0ab" text-anchor="end">BHAVISH S / END OF TRANSMISSION</text></svg>
