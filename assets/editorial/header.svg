<svg viewBox="0 0 1000 390" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bhavish S — Cybersecurity Specialist, Full-Stack Developer, and CFO at YVB&amp;Co">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(12px); } to { opacity:1;transform:translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1{animation-delay:.15s} .a2{animation-delay:.35s} .a3{animation-delay:.55s} .a4{animation-delay:.75s} .a5{animation-delay:.95s} .a6{animation-delay:1.15s}
    @media (prefers-reduced-motion: reduce) {
      .draw,.rise,.fade { animation: none; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>

  <line class="draw a1" x1="48" y1="54" x2="952" y2="54" stroke="#1E3A47" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="#94A3B8" x="48" y="40" font-size="11" letter-spacing="3.5">BHAVISH S // PORTFOLIO DOSSIER</text>
    <text class="mono" fill="#00E5A8" x="952" y="40" font-size="11" letter-spacing="3.5" text-anchor="end">STATUS: AVAILABLE // MYSORE, IN</text>
