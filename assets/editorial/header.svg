  </g>

  <g class="fade a4">
    <text fill="#64748B" class="mono" x="48" y="254" font-size="12.5" letter-spacing="1">Identity  ▸</text>
    <text fill="#F1F5F9" class="mono" x="144" y="254" font-size="12.5">Google-Certified Cybersecurity Student @ MIT Mysore (B.E. CSE) · SIEM &amp; Penetration Testing</text>
  </g>
  <g class="fade a5">
