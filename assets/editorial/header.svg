  <line class="draw a5" x1="48" y1="324" x2="952" y2="324" stroke="#1E3A47" stroke-width="1"/>
  <g class="fade a6">
    <text fill="#94A3B8" class="mono" x="48" y="356" font-size="11.5" letter-spacing="2.5">ETHICAL HACKING &amp; SIEM</text>
    <text fill="#00E5A8" class="mono" x="246" y="356" font-size="11.5">·</text>
    <text fill="#94A3B8" class="mono" x="272" y="356" font-size="11.5" letter-spacing="2.5">FULL-STACK SAAS &amp; RBAC</text>
    <text fill="#00E5A8" class="mono" x="510" y="356" font-size="11.5">·</text>
    <text fill="#94A3B8" class="mono" x="536" y="356" font-size="11.5" letter-spacing="2.5">YVB&amp;CO SOFTWARE STUDIO</text>
