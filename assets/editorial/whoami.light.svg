<svg viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="whoami — bio, focus, status, methodology">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(8px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.35s} .a4{animation-delay:.5s} .a5{animation-delay:.65s} .a6{animation-delay:.8s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <text class="mono rise a1" x="48" y="32" font-size="15" font-weight="600" fill="#0F172A">B.E. Computer Science &amp; Engineering · Cybersecurity Researcher · Karnataka, India.</text>
  <text class="mono rise a2" x="48" y="60" font-size="15" fill="#0F172A">Building across Offensive Security, System Automation, Python, Bash, TypeScript, and Cloud Infrastructure.</text>
  <text class="mono rise a3" x="48" y="88" font-size="14.5" fill="#475569">Drawn to systems that must hold up under adversarial pressure — zero-trust security, resilient pipelines, no single point of failure.</text>

  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="#CBD5E1" stroke-width="1" opacity=".6"/>

  <text class="mono rise a4" x="48"  y="148" font-size="11" fill="#475569" letter-spacing="2.5">FOCUS       ▸ </text>
  <text class="mono rise a4" x="164" y="148" font-size="14.5" fill="#0F172A">Offensive Security · Penetration Testing · SIEM Telemetry · CI/CD DevSecOps Automation.</text>

  <text class="mono rise a5" x="48"  y="182" font-size="11" fill="#475569" letter-spacing="2.5">STATUS      ▸ </text>
  <text class="mono rise a5" x="164" y="182" font-size="14.5" fill="#059669">Open to Security Engineering · Automated Threat Defense · Research Collaboration.</text>

  <text class="mono rise a6" x="48"  y="216" font-size="11" fill="#475569" letter-spacing="2.5">METHODOLOGY ▸ </text>
  <text class="mono rise a6" x="164" y="216" font-size="14.5" fill="#0F172A">Adversarial Emulation → Vulnerability Discovery → Resilient Defensive Engineering.</text>
</svg>