<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bhavish S — Cybersecurity Specialist, Full-Stack Systems Architect &amp; CFO at YVB&amp;Co">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1 { animation-delay: .15s; }
    .a2 { animation-delay: .35s; }
    .a3 { animation-delay: .6s; }
    .a4 { animation-delay: .85s; }
    .a5 { animation-delay: 1.1s; }
    .a6 { animation-delay: 1.35s; }
    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade { animation: none; opacity: 1; stroke-dashoffset: 0; }
    }
  </style>

  <defs>
    <linearGradient id="light-accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="light-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#F1F5F9" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Clean Minimalist White Editorial Canvas -->
  <rect width="1000" height="400" rx="16" fill="#FFFFFF"/>
