  </g>
  <g class="fade a3">
    <text fill="#0284C7" class="mono" x="48" y="202" font-size="19" font-weight="700" letter-spacing="0.5">Cybersecurity Specialist · Full-Stack Systems Architect · CFO &amp; CRO @ YVB&amp;Co</text>
  </g>

  <!-- Technical Value Proposition -->
  <g class="fade a4">
    <text fill="#64748B" class="mono" x="48" y="254" font-size="12.5" font-weight="700" letter-spacing="1">Identity  ▸</text>
    <text fill="#1E293B" class="mono" x="148" y="254" font-size="13" font-weight="600">Google-Certified Cybersecurity Student @ MIT Mysore (B.E. CSE) · SIEM &amp; Threat Defense</text>
  </g>
  <g class="fade a5">
    <text fill="#64748B" class="mono" x="48" y="284" font-size="12.5" font-weight="700" letter-spacing="1">Impact    ▸</text>
    <text fill="#059669" class="mono" x="148" y="284" font-size="13" font-weight="700">Built Campus-Adopted ERPs (Principal's Letter of Appreciation) · ISRO BAH 2026 Finalist</text>
  </g>
  <g class="fade a5">
    <text fill="#64748B" class="mono" x="48" y="314" font-size="12.5" font-weight="700" letter-spacing="1">Venture   ▸</text>
    <text fill="#0F172A" class="mono" x="148" y="314" font-size="13" font-weight="600">Executive Leadership @ YVB&amp;Co Studio · Universal File Converter (UniConv SaaS) · Zero-Trust RBAC</text>
  </g>

  <!-- Bottom Command Bar -->
  <line class="draw a5" x1="48" y1="344" x2="952" y2="344" stroke="#E2E8F0" stroke-width="1.2"/>
  <g class="fade a6">
    <text fill="#475569" class="mono" x="48" y="374" font-size="11.5" font-weight="600" letter-spacing="2.5">ETHICAL HACKING &amp; SIEM</text>
    <text fill="#059669" class="mono" x="256" y="374" font-size="12" font-weight="700">·</text>
    <text fill="#475569" class="mono" x="278" y="374" font-size="11.5" font-weight="600" letter-spacing="2.5">ZERO-TRUST SAAS &amp; RBAC</text>
    <text fill="#059669" class="mono" x="526" y="374" font-size="12" font-weight="700">·</text>
    <text fill="#475569" class="mono" x="548" y="374" font-size="11.5" font-weight="600" letter-spacing="2.5">YVB&amp;CO SOFTWARE STUDIO</text>
    <text fill="#059669" class="mono" x="952" y="374" font-size="12" font-weight="800" letter-spacing="2" text-anchor="end">IAMBHAVISHS.VERCEL.APP ↗</text>
