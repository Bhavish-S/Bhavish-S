  <rect x="1" y="1" width="998" height="398" rx="15" stroke="#E2E8F0" stroke-width="1.2" fill="none"/>
  <path d="M 40 1.5 L 280 1.5" stroke="url(#light-accent-line)" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Metadata Bar -->
  <line class="draw a1" x1="48" y1="56" x2="952" y2="56" stroke="#E2E8F0" stroke-width="1.2"/>
  <g class="fade a1">
    <text class="mono" fill="#475569" x="48" y="42" font-size="11.5" font-weight="600" letter-spacing="3">BHAVISH S // CYBERSECURITY &amp; AUTOMATION ARCHITECT</text>
    <circle cx="738" cy="38" r="4" fill="#059669"/>
    <text class="mono" fill="#059669" x="952" y="42" font-size="11.5" font-weight="700" letter-spacing="2.5" text-anchor="end">STATUS: AVAILABLE // MYSORE, IN</text>
