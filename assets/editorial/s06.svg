<svg viewBox="0 0 1000 92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 06 — CONNECT">
  <style>
    :root { --rule: #1E3A47; --muted: #64748B; --accent: #00E5A8; --ghost: #10232D; --cyan: #38BDF8; }
    @media (prefers-color-scheme: light) {
      :root { --rule: #D1D5DB; --muted: #6B7280; --accent: #059669; --ghost: #E5E7EB; --cyan: #0284C7; }
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, monospace; }
    .draw { stroke: var(--rule); stroke-width: 1; stroke-dasharray: 760; stroke-dashoffset: 760; animation: d 1.3s cubic-bezier(.6,0,.2,1) .2s forwards; }
    @keyframes d { to { stroke-dashoffset: 0; } }
    .f { opacity: 0; animation: f .8s ease .1s forwards; }
    @keyframes f { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .draw { stroke-dashoffset: 0; } .f { opacity: 1; } }
  </style>
  <g class="f">
    <text class="mono" x="48" y="68" font-size="52" font-weight="900" fill="var(--ghost)">06</text>
    <text class="mono" x="128" y="58" font-size="14" font-weight="700" fill="var(--accent)" letter-spacing="6">CONNECT</text>
    <text class="mono" x="952" y="58" font-size="11" fill="var(--muted)" letter-spacing="2" text-anchor="end">~/06-connect</text>
  </g>
  <line class="draw" x1="270" y1="53" x2="820" y2="53"/>
</svg>