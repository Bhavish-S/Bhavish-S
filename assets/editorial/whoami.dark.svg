<svg viewBox="0 0 1000 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bhavish S: Executive Biography, Engineering Focus, and Background">
  <style>
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .a1 { animation-delay: .1s; } .a2 { animation-delay: .2s; } .a3 { animation-delay: .35s; }
    .a4 { animation-delay: .5s; } .a5 { animation-delay: .65s; } .a6 { animation-delay: .8s; }
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
  </style>

  <rect width="1000" height="240" rx="14" fill="#07131B" stroke="#1E3A47" stroke-width="1.2"/>
  
  <text class="mono rise a1" x="48" y="36" font-size="15.5" font-weight="700" fill="#FFFFFF">Computer Science &amp; Engineering Student @ Maharaja Institute of Technology, Mysore (2023 - 2027).</text>
  <text class="mono rise a2" x="48" y="64" font-size="15.5" font-weight="600" fill="#E2E8F0">Google-Certified Cybersecurity Specialist &amp; Full-Stack Architect · CFO &amp; CRO @ YVB&amp;Co Studio.</text>
  <text class="mono rise a3" x="48" y="92" font-size="14" font-weight="500" fill="#94A3B8">Engineered campus-adopted production ERPs recognized with an Official Appreciation Letter from Dr. Murali S., Principal.</text>

  <line class="rise a4" x1="48" y1="116" x2="952" y2="116" stroke="#1E3A47" stroke-width="1.2"/>

  <text class="mono rise a4" x="48" y="146" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="2.5">FOCUS   ▸ </text>
  <text class="mono rise a4" x="148" y="146" font-size="14.5" font-weight="700" fill="#FFFFFF">SIEM &amp; SOC Defense · Penetration Testing · Zero-Trust RBAC · WebAssembly File Security · Enterprise ERPs</text>

  <text class="mono rise a5" x="48" y="178" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="2.5">IMPACT  ▸ </text>
  <text class="mono rise a5" x="148" y="178" font-size="14" font-weight="600" fill="#00E5A8">ISRO BAH 2026 Hackathon Finalist (Route Resilience) · 10+ Production Deployments · 50+ Public Repositories</text>

  <text class="mono rise a6" x="48" y="210" font-size="11.5" font-weight="700" fill="#64748B" letter-spacing="2.5">STATUS  ▸ </text>
  <text class="mono rise a6" x="148" y="210" font-size="14" font-weight="600" fill="#38BDF8">Open for Cybersecurity Roles · Systems Engineering · High-Growth Startups · Research Collaboration</text>
</svg>
