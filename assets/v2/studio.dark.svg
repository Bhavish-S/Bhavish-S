<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Vovalyx — Engineer Your Vision. Custom software development studio."><title>Vovalyx — Engineer Your Vision. Custom software development studio.</title><style>.fi{opacity:0;animation:fi .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fo{opacity:0;animation:fo .7s ease forwards}@keyframes fo{to{opacity:1}}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}.spin{transform-box:view-box;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.spinr{transform-box:view-box;animation:spin 22s linear infinite reverse}.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.comet{animation:comet 7s linear infinite}@keyframes comet{to{stroke-dashoffset:-3200}}.sweep{animation:sweep 5.5s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(-420px)}60%,100%{transform:translateX(1400px)}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2s cubic-bezier(.6,0,.2,1) .3s forwards}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.fi,.fo,.draw{animation:none;opacity:1;stroke-dashoffset:0}.pulse,.ring,.spin,.spinr,.flow,.comet,.sweep,.blink{animation:none}.ring{opacity:0}}</style><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A141C"/><stop offset="1" stop-color="#05090E"/></linearGradient><linearGradient id="acc" x1="0" x2="1"><stop offset="0" stop-color="#00E5A8"/><stop offset=".55" stop-color="#38BDF8"/><stop offset