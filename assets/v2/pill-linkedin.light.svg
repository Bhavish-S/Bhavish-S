<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="117" height="34" viewBox="0 0 117 34" role="img" aria-label="LINKEDIN"><title>LINKEDIN</title><style>.fi{opacity:0;animation:fi .8s cubic-bezier(.2,.7,.2,1) forwards}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.fo{opacity:0;animation:fo .7s ease forwards}@keyframes fo{to{opacity:1}}.pulse{animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}.ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}.spin{transform-box:view-box;animation:spin 14s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.spinr{transform-box:view-box;animation:spin 22s linear infinite reverse}.flow{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-24}}.comet{animation:comet 7s linear infinite}@keyframes comet{to{stroke-dashoffset:-3200}}.sweep{animation:sweep 5.5s ease-in-out infinite}@keyframes sweep{0%{transform:translateX(-420px)}60%,100%{transform:translateX(1400px)}}.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 2s cubic-bezier(.6,0,.2,1) .3s forwards}@keyframes draw{to{stroke-dashoffset:0}}@media (prefers-reduced-motion:reduce){.fi,.fo,.draw{animation:none;opacity:1;stroke-dashoffset:0}.pulse,.ring,.spin,.spinr,.flow,.comet,.sweep,.blink{animation:none}.ring{opacity:0}}</style><rect x=".75" y=".75" width="115.5" height="32.5" rx="17" fill="#FFFFFF" stroke="#0284C7" stroke-opacity=".55"/><circle cx="18" cy="17" r="11" fill="#0284C7" fill-opacity=".14"/><g transform="translate(11.0,10.0) scale(0.5833)" fill="none" stroke="#0284C7" stroke-width="3.43" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v16H4zM8 10v6M8 7.2v.01M12 16v-3.5a2 2 0 0 1 4 0V16M12 10v6"/></g>