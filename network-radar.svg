<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
<title id="title">Network threat radar</title><desc id="desc">Animated green radar rings, nodes and a rotating sweep.</desc><defs><linearGradient id="radarbg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0A100D"/><stop offset="1" stop-color="#050807"/></linearGradient><linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00FF66" stop-opacity=".01"/><stop offset="1" stop-color="#00FF66" stop-opacity=".48"/></linearGradient></defs>
<rect width="1200" height="170" rx="16" fill="url(#radarbg)" stroke="#183C29"/>
<g transform="translate(600 85)"><circle r="66" fill="none" stroke="#65A77C" stroke-opacity=".26"/><circle r="47" fill="none" stroke="#65A77C" stroke-opacity=".25"/><circle r="28" fill="none" stroke="#65A77C" stroke-opacity=".25"/><path d="M-82 0H82M0 -82V82M-58 -58L58 58M-58 58L58 -58" stroke="#183C29"/><path d="M0 0L0 -78A78 78 0 0 1 55 -55Z" fill="url(#sweep)"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></path><circle cx="0" cy="0" r="3" fill="#00FF66"/><circle cx="37" cy="-21" r="3" fill="#B7FFCA"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="-49" cy="17" r="2.5" fill="#00FF66"/><circle cx="12" cy="52" r="2" fill="#00FF66"/></g>
<g font-family="monospace"><text x="52" y="55" fill="#00FF66" font-size="13" letter-spacing="3">NETWORK / THREAT RADAR</text><text x="52" y="82" fill="#8B949E" font-size="11">PASSIVE MONITORING // VISUAL STATUS GRAPHIC</text><text x="1148" y="58" fill="#65A77C" font-size="10" text-anchor="end">SCAN / 360°</text><text x="1148" y="82" fill="#8B949E" font-size="10" text-anchor="end">NODE MAP / LOCAL SVG</text></g>
<path d="M52 112H1148" stroke="#183C29"/><path d="M52 112H330" stroke="#00FF66" stroke-width="2" opacity=".55"/></svg>